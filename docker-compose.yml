name: magpie-workspace

services:
  database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: coder
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder -d coder"]
      interval: 5s
      timeout: 5s
      retries: 30

  coder:
    image: ghcr.io/coder/coder:v2.37.4
    restart: unless-stopped
    user: "0"
    environment:
      CODER_PG_CONNECTION_URL: postgresql://coder:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@database/coder?sslmode=disable
      CODER_HTTP_ADDRESS: 0.0.0.0:7080
      CODER_ACCESS_URL: ${CODER_ACCESS_URL:-http://localhost:7080}
      CODER_TELEMETRY: "false"
      # Only needed when magpie_share=public. See docs/security.md.
      CODER_DANGEROUS_ALLOW_PATH_APP_SHARING: ${CODER_ALLOW_PUBLIC_PATH_APPS:-false}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "7080:7080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - coder-data:/home/coder/.config

volumes:
  postgres-data:
  coder-data:
